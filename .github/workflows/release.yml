name: Release

on:
  # O acionamento manual com publish=true cria a tag e a Release a partir do
  # arquivo VERSION, via `gh release create --target`. Existe porque nem todo
  # ambiente de desenvolvimento tem permissão para dar push de tag; sem isso,
  # publicar dependeria de criar a tag à mão no site.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Criar a tag e a Release a partir do VERSION'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: dmg + zip universal
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Mesma versão fixada do CI — ver o comentário lá.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Conferir que a tag bate com o VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(tr -d ' \n' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag não bate com o VERSION ($version)" >&2
            exit 1
          fi
          echo "versão $version confirmada"

      - name: Localização e testes
        run: |
          make strings
          make test

      - name: Build, verificações e empacotamento
        run: make dist

      - name: Smoke test da interface
        run: make smoke

      - name: Publicar artefatos do workflow
        uses: actions/upload-artifact@v4
        with:
          name: MacMount-universal
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error

      # Sem certificado da Apple os binários vão sem assinatura de
      # desenvolvedor e sem notarização — só a assinatura ad-hoc que o
      # Apple Silicon exige para abrir. As notas de versão explicam ao usuário
      # como abrir na primeira vez.
      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d ' \n' < VERSION)"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<EOF
          MacMount $version — universal (Intel + Apple Silicon), macOS 10.13 ou superior.

          **Primeira abertura:** o app não é notarizado. No macOS 10.13–12,
          clique com o botão direito no app e escolha *Abrir*. No macOS 13 ou
          superior, abra uma vez, vá em *Ajustes do Sistema › Privacidade e
          Segurança* e clique em *Abrir assim mesmo*.
          EOF

          # --target cria a tag no commit atual quando ela ainda não existe, que
          # é o caminho do acionamento manual. Num push de tag ela já existe e o
          # --target é ignorado. Se a Release também já existir, o create falha e
          # o upload --clobber apenas troca os arquivos.
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "MacMount $version" \
            --notes-file "$notes" \
            build/*.dmg build/*.zip \
            || gh release upload "v$version" build/*.dmg build/*.zip --clobber

          echo "Release: $(gh release view "v$version" --json url --jq .url)"
